services:
  postgres:
    image: postgres:16
    container_name: migration-demo
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-mcp:
    image: crystaldba/postgres-mcp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-postgres}
    command: ["--access-mode=unrestricted", "--transport=sse"]
    ports:
      - "8000:8000"
